spring:
  application:
    name: parking-reservation-system
  docker:
    compose:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/parking_db
    username: parking_user
    password: parking_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false


  flyway:
    enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    try-it-out-enabled: true

parking:
  auto-release-timeout: 1h